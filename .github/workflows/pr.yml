name: jira-pr

# On PR merge into main or a release-* branch: tag the ticket with the branch's
# VERSION and transition it. No action dependencies — a one-line shallow clone
# (depth 1, just the base branch) replaces actions/checkout.
on:
  pull_request:
    types: [closed]
    branches: [main, master, "release-*"]

permissions:
  contents: read

jobs:
  jira:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Tag + transition Jira issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # PR text via env (never shell-interpolated) to avoid injection:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DONE_STATUS: Done
        run: |
          git clone --depth 1 --branch "$BASE_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" repo
          cd repo
          node scripts/on-merge.mjs
