name: jira-smoke

# Manual test: proves the Jira creds + fix-version append work in CI.
# URL/email come from repo Variables; the token from a repo Secret.
on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue to stamp
        default: TESTAPP-1
        required: true
      fix_version:
        description: Fix version to ensure + append
        default: "1.2.3"
        required: true

permissions: {}          # job needs no repo token

jobs:
  smoke:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/jira-smoke.mjs
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ inputs.issue_key }}
          FIX_VERSION: ${{ inputs.fix_version }}
