name: commit-lint

# Require every commit subject to start with the Jira project key (e.g. TESTAPP-1:).
# The key is configurable via the repo Variable JIRA_PROJECT_KEY.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/check-commit-messages.mjs
        env:
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || format('{0}..{1}', github.event.before, github.sha) }}
